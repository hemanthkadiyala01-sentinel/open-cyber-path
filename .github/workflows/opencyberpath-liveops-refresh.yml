name: OpenCyberPath LiveOps source refresh

on:
  schedule:
    # Every six hours (UTC). Scheduled workflows may be delayed by GitHub.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Optional reason for a manual LiveOps feed refresh'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: opencyberpath-liveops-feed
  cancel-in-progress: false

jobs:
  refresh-public-source-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate current feed without network requests
        run: python tools/liveops/refresh_feed.py --self-test

      - name: Run deterministic offline collector tests
        run: python -m unittest tools.liveops.test_refresh_feed -v

      - name: Refresh approved public sources
        run: python tools/liveops/refresh_feed.py --scheduled

      - name: Check feed schema and privacy fields
        run: python tools/liveops/refresh_feed.py --self-test

      - name: Commit feed only when changed
        shell: bash
        run: |
          if git diff --quiet -- website/public/liveops-feed.json; then
            echo "Source feed is unchanged; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/public/liveops-feed.json
          git commit -m "chore: refresh OpenCyberPath LiveOps public source feed"
          git push
