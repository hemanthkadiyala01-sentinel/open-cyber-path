<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">GRC risk register concept</title><desc id="d">A risk-management diagram connecting asset, risk, control, evidence, owner, and review.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#292418"/><stop offset="1" stop-color="#171d2d"/></linearGradient></defs><rect width="760" height="420" rx="26" fill="url(#bg)"/><g opacity=".14" stroke="#f0c87d"><path d="M30 70H730M30 120H730M30 170H730M30 220H730M30 270H730M30 320H730M30 370H730"/></g><text x="38" y="42" fill="#ffd38a" font-family="Arial" font-size="13" letter-spacing="2">GRC / RISK TO ACTION</text><g stroke-width="2" fill="none" stroke="#e0b96d"><path d="M188 127H275M405 127H492M558 166v46H380v26M380 284v24H190v-22M380 284v24H570v-22"/><path d="M266 121l9 6-9 6M483 121l9 6-9 6M374 190l6 8 6-8M184 300l6 6 6-6M564 300l6 6 6-6"/></g><g font-family="Arial"><rect x="42" y="86" width="146" height="82" rx="13" fill="#173246" stroke="#74cfff" stroke-width="2"/><text x="65" y="116" fill="#c7efff" font-size="12" font-weight="bold">ASSET</text><text x="65" y="140" fill="#a9c5d8" font-size="11">What matters?</text><rect x="275" y="86" width="130" height="82" rx="13" fill="#392921" stroke="#ffb783" stroke-width="2"/><text x="302" y="116" fill="#ffcfaa" font-size="12" font-weight="bold">RISK</text><text x="296" y="140" fill="#d7bcae" font-size="11">What could happen?</text><rect x="492" y="86" width="220" height="82" rx="13" fill="#292540" stroke="#ccb1ff" stroke-width="2"/><text x="516" y="116" fill="#e2d5ff" font-size="12" font-weight="bold">CONTROL</text><text x="516" y="140" fill="#c2b9dd" font-size="11">What reduces the risk?</text><rect x="250" y="244" width="260" height="64" rx="13" fill="#14372f" stroke="#78e0bd" stroke-width="2"/><text x="275" y="270" fill="#a6f2d8" font-size="12" font-weight="bold">EVIDENCE + OWNER</text><text x="275" y="291" fill="#aad7c9" font-size="10">How do we verify and follow up?</text><rect x="45" y="334" width="670" height="45" rx="10" fill="#101c2a" stroke="#6d664c"/><text x="64" y="361" fill="#ffe0a5" font-size="11">Every rating needs a rationale. A checklist alone is not proof of compliance.</text></g></svg>