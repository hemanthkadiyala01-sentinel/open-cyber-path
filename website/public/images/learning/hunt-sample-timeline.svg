<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Synthetic sign-in and DNS investigation timeline</title><desc id="desc">Concept illustration showing authentication failures, a later success and DNS events for a local synthetic training dataset. Consult the included CSV for actual rows.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#072c35"/><stop offset="1" stop-color="#071522"/></linearGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#ff8a68"/><stop offset=".7" stop-color="#46d9c6"/><stop offset="1" stop-color="#70a9ff"/></linearGradient></defs><rect width="1200" height="560" rx="26" fill="url(#bg)"/><g stroke="#174754" stroke-width="1" opacity=".55"><path d="M45 80H1155M45 140H1155M45 200H1155M45 260H1155M45 320H1155M45 380H1155M45 440H1155M45 500H1155"/><path d="M145 45V520M245 45V520M345 45V520M445 45V520M545 45V520M645 45V520M745 45V520M845 45V520M945 45V520M1045 45V520"/></g><text x="48" y="46" fill="#d3f3ef" font-size="20" font-family="Arial,sans-serif" font-weight="700">AUTHENTICATION + DNS — TRAINING TIMELINE</text><text x="48" y="68" fill="#86aeb9" font-size="13" font-family="Arial,sans-serif">Concept illustration · use the CSV rows as the source of truth</text><g font-family="monospace" font-size="13" fill="#9cbac4"><text x="55" y="118">09:00</text><text x="245" y="118">09:02</text><text x="435" y="118">09:04</text><text x="625" y="118">09:06</text><text x="815" y="118">09:08</text><text x="1005" y="118">09:10+</text></g><path d="M70 230 C190 230 230 230 300 230 S420 230 500 230 S650 230 715 230 S900 230 1115 230" stroke="url(#line)" stroke-width="4" fill="none"/><g><circle cx="92" cy="230" r="10" fill="#ff8a68" stroke="#ffd4c5" stroke-width="2"/><circle cx="170" cy="230" r="10" fill="#ff8a68" stroke="#ffd4c5" stroke-width="2"/><circle cx="255" cy="230" r="10" fill="#ff8a68" stroke="#ffd4c5" stroke-width="2"/><circle cx="335" cy="230" r="10" fill="#ff8a68" stroke="#ffd4c5" stroke-width="2"/><circle cx="420" cy="230" r="10" fill="#ff8a68" stroke="#ffd4c5" stroke-width="2"/><circle cx="505" cy="230" r="10" fill="#ff8a68" stroke="#ffd4c5" stroke-width="2"/><circle cx="625" cy="230" r="11" fill="#49d8ba" stroke="#d4fff4" stroke-width="2"/><circle cx="875" cy="230" r="10" fill="#71adff" stroke="#d6e9ff" stroke-width="2"/><circle cx="975" cy="230" r="10" fill="#71adff" stroke="#d6e9ff" stroke-width="2"/></g><g font-family="Arial,sans-serif"><rect x="55" y="285" width="450" height="125" rx="16" fill="#3a201e" stroke="#9a5142"/><text x="78" y="318" fill="#ff9a7f" font-size="16" font-weight="700">Repeated authentication failures</text><text x="78" y="346" fill="#ddc2bf" font-size="14">A pattern worth investigating in context.</text><text x="78" y="370" fill="#ddc2bf" font-size="14">It is not proof of compromise by itself.</text><rect x="525" y="285" width="270" height="125" rx="16" fill="#103732" stroke="#238b79"/><text x="548" y="318" fill="#63e5cf" font-size="16" font-weight="700">Later success</text><text x="548" y="346" fill="#bcddd9" font-size="14">Check device, user, and</text><text x="548" y="370" fill="#bcddd9" font-size="14">baseline context.</text><rect x="815" y="285" width="330" height="125" rx="16" fill="#132c4b" stroke="#3e7eba"/><text x="838" y="318" fill="#83baff" font-size="16" font-weight="700">DNS events</text><text x="838" y="346" fill="#c0d4e7" font-size="14">Repeated lookups need context.</text><text x="838" y="370" fill="#c0d4e7" font-size="14">Compare with normal activity.</text></g><g font-family="Arial,sans-serif" font-size="13"><circle cx="65" cy="460" r="6" fill="#ff8a68"/><text x="80" y="465" fill="#c8dce2">Failure</text><circle cx="170" cy="460" r="6" fill="#49d8ba"/><text x="185" y="465" fill="#c8dce2">Success</text><circle cx="270" cy="460" r="6" fill="#71adff"/><text x="285" y="465" fill="#c8dce2">DNS</text><text x="48" y="520" fill="#6e939f" font-size="12">SYNTHETIC TRAINING EVENTS — NOT LIVE TELEMETRY</text></g></svg>
