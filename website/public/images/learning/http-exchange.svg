<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">HTTP request and response learning diagram</title><desc id="desc">A safe diagram showing browser, request, server, response status codes, headers and defensive review topics.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28113d"/><stop offset="1" stop-color="#081525"/></linearGradient></defs><rect width="1200" height="560" rx="26" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="48" y="48" font-size="21" font-weight="700" fill="#f0e1ff">READ AN HTTP EXCHANGE</text><text x="48" y="74" font-size="13" fill="#b49ac8">Observe request and response fields in an authorised training lab</text><rect x="55" y="120" width="250" height="270" rx="20" fill="#20163a" stroke="#9d66c7" stroke-width="2"/><rect x="80" y="150" width="200" height="118" rx="12" fill="#0e2036" stroke="#6b52a2"/><circle cx="98" cy="168" r="5" fill="#ff8eaa"/><circle cx="116" cy="168" r="5" fill="#f5c16d"/><circle cx="134" cy="168" r="5" fill="#55e2c4"/><rect x="97" y="192" width="163" height="8" rx="4" fill="#6b52a2"/><rect x="97" y="211" width="126" height="8" rx="4" fill="#a16bd4"/><rect x="97" y="230" width="145" height="8" rx="4" fill="#8e6ab8"/><text x="82" y="307" fill="#f3eaff" font-size="20" font-weight="700">Browser</text><text x="82" y="335" fill="#bdaacf" font-size="14">Client request</text><text x="82" y="356" fill="#bdaacf" font-size="14">Path · method · headers</text><path d="M320 190H450" stroke="#e1a2ff" stroke-width="4"/><path d="m435 176 16 14-16 14" fill="none" stroke="#e1a2ff" stroke-width="4"/><text x="330" y="170" fill="#e1a2ff" font-size="14" font-weight="700">REQUEST</text><rect x="345" y="215" width="150" height="70" rx="12" fill="#321846" stroke="#a569d5"/><text x="365" y="242" fill="#f0d9ff" font-size="14" font-weight="700">GET /example</text><text x="365" y="263" fill="#c1a7dc" font-size="12">Training target only</text><rect x="520" y="120" width="250" height="270" rx="20" fill="#102b3d" stroke="#4b9ec2" stroke-width="2"/><rect x="560" y="151" width="170" height="115" rx="12" fill="#091b29" stroke="#31748e"/><rect x="584" y="176" width="122" height="12" rx="4" fill="#2a8dad"/><rect x="584" y="198" width="94" height="8" rx="4" fill="#3686a0"/><rect x="584" y="215" width="111" height="8" rx="4" fill="#3686a0"/><rect x="584" y="232" width="78" height="8" rx="4" fill="#3686a0"/><text x="555" y="307" fill="#e3f8ff" font-size="20" font-weight="700">Web server</text><text x="555" y="335" fill="#b6d8e5" font-size="14">Routing · auth · app logic</text><text x="555" y="356" fill="#b6d8e5" font-size="14">Input and access controls</text><path d="M785 190H915" stroke="#6fe7ce" stroke-width="4"/><path d="m900 176 16 14-16 14" fill="none" stroke="#6fe7ce" stroke-width="4"/><text x="799" y="170" fill="#6fe7ce" font-size="14" font-weight="700">RESPONSE</text><rect x="810" y="215" width="150" height="70" rx="12" fill="#10362f" stroke="#2aa68d"/><text x="832" y="242" fill="#87f3d9" font-size="17" font-weight="700">200 / 401 / 403</text><text x="832" y="263" fill="#b7ded8" font-size="12">Status + headers</text><rect x="975" y="120" width="170" height="270" rx="20" fill="#362817" stroke="#c49245" stroke-width="2"/><circle cx="1060" cy="184" r="30" fill="#4c3516" stroke="#f0c16e" stroke-width="2"/><path d="m1047 184 9 9 18-20" stroke="#f0c16e" stroke-width="4" fill="none" stroke-linecap="round"/><text x="1003" y="246" fill="#ffe0a7" font-size="19" font-weight="700">Review</text><text x="1000" y="276" fill="#ddc39a" font-size="13">Status code</text><text x="1000" y="297" fill="#ddc39a" font-size="13">Cache / security</text><text x="1000" y="318" fill="#ddc39a" font-size="13">Auth / permissions</text><text x="1000" y="354" fill="#ddc39a" font-size="12">Evidence before claims</text><rect x="55" y="430" width="1090" height="72" rx="14" fill="#0c2130" stroke="#244b5d"/><text x="79" y="460" fill="#e0ccff" font-size="15" font-weight="700">Safe practice rule</text><text x="79" y="484" fill="#aec5d2" font-size="14">Use the provided lab or a target whose owner explicitly authorises the activity. Do not test random public systems.</text></g></svg>
