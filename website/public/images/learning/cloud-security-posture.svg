<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">Cloud security posture review</title><desc id="d">A fictional cloud architecture showing identity, private network, storage, logs, and a security review boundary.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102e42"/><stop offset="1" stop-color="#121c35"/></linearGradient><linearGradient id="a" x2="1" y2="1"><stop stop-color="#70d4ff"/><stop offset="1" stop-color="#8d9aff"/></linearGradient></defs><rect width="760" height="420" rx="26" fill="url(#bg)"/><g opacity=".16" stroke="#82c8ec"><path d="M40 70H720M40 120H720M40 170H720M40 220H720M40 270H720M40 320H720M40 370H720M90 40V380M160 40V380M230 40V380M300 40V380M370 40V380M440 40V380M510 40V380M580 40V380M650 40V380"/></g><text x="38" y="40" fill="#9bdfff" font-size="13" font-family="Arial" letter-spacing="2">CLOUD SECURITY / POSTURE REVIEW</text><rect x="42" y="84" width="152" height="88" rx="14" fill="#10283e" stroke="#6bcdf6" stroke-width="2"/><circle cx="72" cy="113" r="12" fill="#6bcdf6"/><path d="M66 113h12M72 107v12" stroke="#10283e" stroke-width="2"/><text x="92" y="115" fill="#e5f7ff" font-family="Arial" font-size="13" font-weight="bold">Identity</text><text x="58" y="145" fill="#9fbdcf" font-family="Arial" font-size="10">Least privilege</text><rect x="260" y="84" width="180" height="88" rx="14" fill="#142b41" stroke="#7fb6ff" stroke-width="2"/><path d="M282 118h20l8-12 12 22h23" fill="none" stroke="#7fb6ff" stroke-width="3"/><text x="284" y="145" fill="#e5f1ff" font-family="Arial" font-size="13" font-weight="bold">Network boundary</text><rect x="507" y="84" width="210" height="88" rx="14" fill="#24243c" stroke="#b5a5ff" stroke-width="2"/><path d="M531 105h22v24h-22zM536 112h12M536 118h12" fill="none" stroke="#b5a5ff" stroke-width="2"/><text x="565" y="116" fill="#eeeaff" font-family="Arial" font-size="13" font-weight="bold">Data &amp; storage</text><text x="525" y="145" fill="#bbb4d9" font-family="Arial" font-size="10">Private by default</text><path d="M194 128H260M440 128H507" stroke="#e8bb72" stroke-width="3" stroke-dasharray="6 6"/><path d="M194 134l-8-6 8-6M507 134l8-6-8-6" fill="none" stroke="#e8bb72" stroke-width="2"/><rect x="156" y="240" width="448" height="112" rx="16" fill="#0b1c2d" stroke="#4b87a7" stroke-width="2"/><text x="180" y="270" fill="#e6f7ff" font-family="Arial" font-size="14" font-weight="bold">Verification questions</text><g fill="#b6cad8" font-family="Arial" font-size="11"><text x="180" y="296">01  Who can access it?</text><text x="180" y="318">02  What is exposed?</text><text x="418" y="296">03  Are actions logged?</text><text x="418" y="318">04  Can recovery be tested?</text></g><path d="M117 172v32h263v36M350 172v30M615 172v32H380" stroke="#6fd8c2" fill="none" stroke-width="2" stroke-dasharray="4 6"/><circle cx="380" cy="240" r="5" fill="#6fd8c2"/><text x="42" y="395" fill="#8fa9bc" font-size="10" font-family="Arial">Fictional architecture for learning; no live cloud resources are created.</text></svg>
