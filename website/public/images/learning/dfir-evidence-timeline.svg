<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">DFIR evidence timeline</title><desc id="d">A fictional incident timeline linking source records to timestamps and cautious analyst conclusions.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#30212d"/><stop offset="1" stop-color="#142137"/></linearGradient></defs><rect width="760" height="420" rx="26" fill="url(#bg)"/><g opacity=".14" stroke="#ffa38f"><path d="M35 70H725M35 120H725M35 170H725M35 220H725M35 270H725M35 320H725M35 370H725"/></g><text x="38" y="42" fill="#ffad9a" font-family="Arial" font-size="13" letter-spacing="2">DFIR / EVIDENCE TO TIMELINE</text><path d="M90 142H664" stroke="#ffb39d" stroke-width="3" stroke-linecap="round"/><g font-family="Arial" text-anchor="middle"><circle cx="110" cy="142" r="8" fill="#8fd4ff" stroke="#142137" stroke-width="3"/><circle cx="278" cy="142" r="8" fill="#f8cc7b" stroke="#142137" stroke-width="3"/><circle cx="446" cy="142" r="8" fill="#a8a1ff" stroke="#142137" stroke-width="3"/><circle cx="634" cy="142" r="8" fill="#7ce0c4" stroke="#142137" stroke-width="3"/><g fill="#e6f1fb" font-size="11" font-weight="bold"><text x="110" y="111">SOURCE A</text><text x="278" y="111">SOURCE B</text><text x="446" y="111">SOURCE C</text><text x="634" y="111">ANALYST NOTE</text></g><g fill="#9fb5c9" font-size="10"><text x="110" y="174">Event record</text><text x="278" y="174">Identity log</text><text x="446" y="174">DNS sample</text><text x="634" y="174">Interpretation</text></g></g><g font-family="Arial"><rect x="48" y="222" width="204" height="103" rx="12" fill="#102a40" stroke="#68bce8"/><text x="67" y="248" fill="#a6e3ff" font-size="12" font-weight="bold">PRESERVE</text><text x="67" y="271" fill="#bfd0df" font-size="10">Record source, scope,</text><text x="67" y="288" fill="#bfd0df" font-size="10">collector, and integrity.</text><rect x="278" y="222" width="204" height="103" rx="12" fill="#332a1d" stroke="#e0b468"/><text x="297" y="248" fill="#ffd996" font-size="12" font-weight="bold">CORRELATE</text><text x="297" y="271" fill="#d5c4a3" font-size="10">Normalise UTC and link</text><text x="297" y="288" fill="#d5c4a3" font-size="10">records to their sources.</text><rect x="508" y="222" width="204" height="103" rx="12" fill="#20243c" stroke="#a49bfa"/><text x="527" y="248" fill="#c9c5ff" font-size="12" font-weight="bold">QUALIFY</text><text x="527" y="271" fill="#c0c6da" font-size="10">Separate facts, hypotheses,</text><text x="527" y="288" fill="#c0c6da" font-size="10">and unknowns.</text><text x="42" y="382" fill="#9eb4c7" font-size="10">Fictional training records only. Preserve originals; practise within an authorised lab.</text></g></svg>