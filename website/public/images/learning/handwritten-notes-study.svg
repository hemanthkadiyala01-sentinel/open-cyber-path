<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Handwritten-style cybersecurity field notes</title>
<desc id="desc">A warm paper notebook illustration with readable SOC triage prompts and a simple evidence workflow: event, context, evidence, decision.</desc>
<defs>
  <pattern id="rules" width="1200" height="34" patternUnits="userSpaceOnUse"><path d="M0 33H1200" stroke="#b8d1e1" stroke-width="1" opacity=".72"/></pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#5c4325" flood-opacity=".15"/></filter>
</defs>
<rect width="1200" height="560" rx="24" fill="#ead3a0"/>
<rect x="20" y="18" width="1160" height="524" rx="17" fill="#fbf4df" stroke="#d4b779" stroke-width="3"/>
<rect x="24" y="22" width="1152" height="516" rx="14" fill="url(#rules)"/>
<path d="M135 34V526" stroke="#e58d8e" stroke-width="3" opacity=".9"/>
<g fill="#6689a0" opacity=".8"><circle cx="48" cy="80" r="7"/><circle cx="48" cy="160" r="7"/><circle cx="48" cy="240" r="7"/><circle cx="48" cy="320" r="7"/><circle cx="48" cy="400" r="7"/><circle cx="48" cy="480" r="7"/></g>
<g font-family="'Segoe Print','Comic Sans MS',cursive">
  <text x="168" y="75" fill="#244d76" font-size="29" font-weight="700" transform="rotate(-.7 168 75)">SOC TRIAGE FIELD NOTES</text>
  <path d="M168 88 Q300 95 426 86 T650 88" stroke="#2a8fb4" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="168" y="121" fill="#9b5a30" font-size="16">Field note 01 · Follow evidence, not assumptions</text>
  <rect x="906" y="48" width="212" height="42" rx="8" fill="#f5c96d" stroke="#cf9346" stroke-width="2" transform="rotate(2 906 48)"/>
  <text x="925" y="75" fill="#67451c" font-size="17" font-weight="700" transform="rotate(2 925 75)">CHECK THE SOURCE</text>
</g>
<g filter="url(#shadow)" font-family="'Segoe Print','Comic Sans MS',cursive" font-size="17" font-weight="700">
  <rect x="168" y="150" width="190" height="78" rx="13" fill="#d9eaff" stroke="#548dcc" stroke-width="2" transform="rotate(-1 168 150)"/><text x="194" y="181" fill="#164a84">1 · EVENT</text><text x="194" y="207" fill="#345f8b" font-size="13" font-weight="400">What happened?</text>
  <path d="M364 190H405" stroke="#8560ad" stroke-width="4" fill="none" stroke-linecap="round"/><path d="m394 180 12 10-12 10" stroke="#8560ad" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="413" y="150" width="190" height="78" rx="13" fill="#e7dcff" stroke="#9678c2" stroke-width="2" transform="rotate(1 413 150)"/><text x="438" y="181" fill="#64428f">2 · CONTEXT</text><text x="438" y="207" fill="#765b9c" font-size="13" font-weight="400">Who / when / where?</text>
  <path d="M609 190H650" stroke="#8560ad" stroke-width="4" fill="none" stroke-linecap="round"/><path d="m639 180 12 10-12 10" stroke="#8560ad" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="658" y="150" width="190" height="78" rx="13" fill="#d8f3e6" stroke="#58a58c" stroke-width="2" transform="rotate(-.7 658 150)"/><text x="684" y="181" fill="#236b59">3 · EVIDENCE</text><text x="684" y="207" fill="#3a806e" font-size="13" font-weight="400">Which fields support it?</text>
  <path d="M854 190H895" stroke="#8560ad" stroke-width="4" fill="none" stroke-linecap="round"/><path d="m884 180 12 10-12 10" stroke="#8560ad" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="903" y="150" width="215" height="78" rx="13" fill="#ffe4d1" stroke="#d78f68" stroke-width="2" transform="rotate(.8 903 150)"/><text x="929" y="181" fill="#984b2d">4 · DECISION</text><text x="929" y="207" fill="#a46649" font-size="13" font-weight="400">What should happen next?</text>
</g>
<g font-family="'Segoe Print','Comic Sans MS',cursive" fill="#294b68">
  <text x="170" y="283" font-size="19" font-weight="700">Quick investigation checklist</text>
  <path d="M171 292 Q300 298 455 291" stroke="#c56e4b" stroke-width="2" fill="none"/>
  <g font-size="16"><text x="184" y="329">□ Confirm the timestamp and timezone.</text><text x="184" y="364">□ Record host, user, process, and result.</text><text x="184" y="399">□ Compare with normal baseline activity.</text><text x="184" y="434">□ Note alternate explanations and gaps.</text></g>
  <rect x="168" y="462" width="500" height="47" rx="9" fill="#fff0b8" stroke="#dfb958" stroke-width="2"/><text x="185" y="492" font-size="15" fill="#7a581e" font-weight="700">Facts first · State uncertainty · Cite the source</text>
</g>
<g transform="translate(747 280)" font-family="'Segoe Print','Comic Sans MS',cursive">
  <rect x="0" y="0" width="365" height="210" rx="16" fill="#fffaf0" stroke="#7e9fb2" stroke-width="2"/>
  <text x="20" y="31" fill="#244d76" font-size="18" font-weight="700">Evidence sketch</text>
  <rect x="20" y="49" width="96" height="50" rx="8" fill="#d9eaff" stroke="#548dcc" stroke-width="2"/><text x="38" y="69" fill="#164a84" font-size="13">Host</text><text x="29" y="87" fill="#345f8b" font-size="11">TRAIN-WIN</text>
  <path d="M118 74H151" stroke="#7c64a7" stroke-width="3"/><path d="m143 67 9 7-9 7" fill="none" stroke="#7c64a7" stroke-width="3"/>
  <rect x="155" y="49" width="190" height="50" rx="8" fill="#e7dcff" stroke="#9678c2" stroke-width="2"/><text x="171" y="70" fill="#64428f" font-size="13">Event record</text><text x="171" y="87" fill="#765b9c" font-size="11">time · result · label</text>
  <path d="M250 103V127" stroke="#7c64a7" stroke-width="3"/><path d="m243 120 7 9 7-9" fill="none" stroke="#7c64a7" stroke-width="3"/>
  <rect x="74" y="132" width="220" height="50" rx="8" fill="#d8f3e6" stroke="#58a58c" stroke-width="2"/><text x="93" y="153" fill="#236b59" font-size="13">Analyst note</text><text x="93" y="170" fill="#3a806e" font-size="11">claim + evidence + limits</text>
</g>
</svg>
